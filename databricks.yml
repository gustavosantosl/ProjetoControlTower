# This is a Declarative Automation Bundle definition for vertice.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: vertice
  uuid: 9a9e1891-28e4-4b1d-aa92-1511d017195c

include:
  - resources/vertice_medalhao.pipeline.yml
  - resources/vertice.job.yml
  - resources/dashboard.dashboard.yml
  - resources/genie.genie_space.yml

sync:
  exclude:
    - resources/*.lvdash.json
    - minha-torre/**

# Shared variables for the dev bundle and future targets.
variables:
  catalog:
    description: The catalog to use
    default: lakehouse_vertice
  warehouse_id:
    description: SQL warehouse for the bronze check
    default: YOUR_SQL_WAREHOUSE_ID
  s3_access_key_id:
    description: chave do data lake (o valor fica fora do Git)
  s3_secret_access_key:
    description: chave do data lake (o valor fica fora do Git)

targets:
  dev:
    default: true
    presets:
      trigger_pause_status: PAUSED
    workspace:
      host: https://your-workspace.cloud.databricks.com
  prod:
    mode: production
    workspace:
      host: https://your-workspace.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/project-vertice@users.noreply.github.com to make sure we only have a single copy.
      root_path: /Workspace/Users/project-vertice@users.noreply.github.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: project-vertice@users.noreply.github.com
        level: CAN_MANAGE
