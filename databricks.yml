# This is a Declarative Automation Bundle definition for vertice.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: vertice
  uuid: 9a9e1891-28e4-4b1d-aa92-1511d017195c

include:
  - resources/vertice_medalhao.pipeline.yml
  - resources/vertice.job.yml
  - resources/dashboard.dashboard.yml
  - resources/genie.genie_space.yml

sync:
  exclude:
    - resources/*.lvdash.json
    - minha-torre/**

# Values that identify a workspace or an account must be supplied at deploy
# time. Keep them outside Git using --var or a local Databricks configuration.
variables:
  catalog:
    description: The catalog to use
    default: lakehouse_vertice
  warehouse_id:
    description: SQL Warehouse ID for SQL tasks
  deployment_user_email:
    description: Workspace user email used for the production bundle path and permission
  s3_access_key_id:
    description: Storage access key supplied outside Git
  s3_secret_access_key:
    description: Storage secret key supplied outside Git

targets:
  dev:
    default: true
    presets:
      trigger_pause_status: PAUSED
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${var.deployment_user_email}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${var.deployment_user_email}
        level: CAN_MANAGE
