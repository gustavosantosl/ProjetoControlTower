bundle:
  name: minha-torre

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  genie_space_id:
    description: ID do espaço Farol · Diretoria
  genie_space_name:
    description: Nome do espaço Farol · Diretoria

resources:
  apps:
    app:
      name: "minha-torre"
      description: "Projeto Farol · projetos em risco e simulador de realocação"
      source_code_path: ./
      user_api_scopes:
        - dashboards.genie
      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN

targets:
  default:
    default: true
    workspace:
      host: https://your-workspace.cloud.databricks.com

    variables:
      sql_warehouse_id: YOUR_SQL_WAREHOUSE_ID
      genie_space_id: YOUR_GENIE_SPACE_ID
      genie_space_name: "Farol · Diretoria"
